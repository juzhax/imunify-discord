name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y jq curl util-linux shellcheck
      - run: bash -n install.sh update.sh uninstall.sh scripts/*.sh tests/*.sh
      - run: shellcheck install.sh update.sh uninstall.sh scripts/*.sh
      - run: bash tests/run.sh
      - run: sudo bash tests/install-integration.sh
